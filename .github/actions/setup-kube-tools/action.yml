name: Setup kube tools
description: Install kubectl, kustomize, and skaffold at the versions this pipeline is tested against
runs:
  using: composite
  steps:
    - uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
      with:
        kubectl: "1.36.4"
        kustomize: "5.8.1"
        skaffold: "2.24.0"
