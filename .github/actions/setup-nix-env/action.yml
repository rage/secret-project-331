name: Setup Nix environment
description: Install Nix, restore the Nix store cache, and export this repo's flake devShell (kubectl, kustomize, skaffold, minikube, node, pnpm, the pinned Rust toolchain, actionlint, zizmor, etc.) to subsequent steps
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
    - name: Export flake devShell environment
      shell: bash
      run: |
        set -euo pipefail
        # Each `run:` step is a fresh shell, so the devShell env only reaches later steps
        # by being written to $GITHUB_ENV/$GITHUB_PATH here instead of just sourced in-process.
        source <(nix print-dev-env)
        eval "$shellHook"
        {
          echo "PATH=$PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR"
          echo "OPENSSL_LIB_DIR=$OPENSSL_LIB_DIR"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          echo "TILT_DISABLE_ANALYTICS=$TILT_DISABLE_ANALYTICS"
          if [ -n "${RUSTFLAGS:-}" ]; then echo "RUSTFLAGS=$RUSTFLAGS"; fi
          if [ -n "${SKAFFOLD_PLATFORM:-}" ]; then echo "SKAFFOLD_PLATFORM=$SKAFFOLD_PLATFORM"; fi
        } >> "$GITHUB_ENV"
