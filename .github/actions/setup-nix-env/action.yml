name: Setup Nix environment
description: Install Nix, restore the pnpm cache, and export this repo's flake devShell (kubectl, kustomize, skaffold, minikube, node, pnpm, the pinned Rust toolchain, actionlint, zizmor, etc.) to subsequent steps
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      timeout-minutes: 5
    - name: Export flake devShell environment
      shell: bash
      timeout-minutes: 5
      run: | # zizmor: ignore[github-env] every value written here comes from the pinned Nix flake or local repo files, never PR/issue-controlled input
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"

        # Each `run:` step is a fresh shell, so the devShell env only reaches later steps
        # by being written to $GITHUB_ENV here instead of just sourced in-process. Writing
        # to a file first (rather than `source <(nix print-dev-env)`) means a `nix` failure
        # is caught by `set -e` instead of being masked by the process substitution.
        # The dumped script already ends with `eval "$shellHook"`, so sourcing it runs the
        # hook once; evaluating it again here would duplicate its PATH/PKG_CONFIG_PATH exports.
        nix print-dev-env > /tmp/nix-dev-env.sh
        source /tmp/nix-dev-env.sh

        # Keeps CI on the exact Node version package.json declares instead of silently
        # floating with whatever flake.lock's nixpkgs revision currently pins.
        EXPECTED_NODE_VERSION="v$(node -p "const v = require('./package.json').devEngines?.runtime?.version; if (!v) throw new Error('Expected devEngines.runtime.version in package.json'); v")"
        ACTUAL_NODE_VERSION="$(node -v)"
        if [ "$EXPECTED_NODE_VERSION" != "$ACTUAL_NODE_VERSION" ]; then
          echo "::error::package.json declares Node $EXPECTED_NODE_VERSION but flake.nix's devShell provides $ACTUAL_NODE_VERSION. Update package.json's devEngines.runtime.version (and flake.nix's nodeVersion, used for the macOS override) to match." >&2
          exit 1
        fi

        # Keep this list in sync with flake.nix's devShells.default mkShell attrs and
        # shellHook exports — a new export added there needs a matching line here, or it
        # reaches `nix develop` locally but never reaches CI steps after this one.
        {
          echo "PATH=$PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR"
          echo "OPENSSL_LIB_DIR=$OPENSSL_LIB_DIR"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          echo "TILT_DISABLE_ANALYTICS=$TILT_DISABLE_ANALYTICS"
          if [ -n "${RUSTFLAGS:-}" ]; then echo "RUSTFLAGS=$RUSTFLAGS"; fi
          if [ -n "${SKAFFOLD_PLATFORM:-}" ]; then echo "SKAFFOLD_PLATFORM=$SKAFFOLD_PLATFORM"; fi
        } >> "$GITHUB_ENV"

        echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Cache pnpm dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
