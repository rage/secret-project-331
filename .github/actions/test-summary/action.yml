name: Test summary
description: Append a status block for this job to the workflow run summary
inputs:
  title:
    description: Heading for the summary block, including any emoji
    required: true
  details:
    description: Extra markdown bullet lines to append below the status line
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TITLE: ${{ inputs.title }}
        DETAILS: ${{ inputs.details }}
        STATUS: ${{ job.status }}
      run: |
        {
          echo "## $TITLE"
          echo "- **Status**: $STATUS"
          if [ -n "$DETAILS" ]; then
            echo "$DETAILS"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
