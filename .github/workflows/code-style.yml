name: Code Style

permissions: read-all

on:
  push:
    branches:
      - master
      - canary
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  code-style:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-env
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest # zizmor: ignore[unpinned-images] intentionally tracks the latest actionlint release
        with:
          args: -color
      - name: Zizmor
        run: zizmor --gh-token "$GH_TOKEN" .github/workflows/ .github/actions/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Oxlint
        run: pnpm run lint:ci
      - name: Oxfmt
        run: pnpm run format:check
      - name: Stylelint
        run: pnpm run lint:css
      - name: Cargo fmt
        run: cargo fmt --manifest-path services/headless-lms/Cargo.toml --all -- --files-with-diff --check
