name: Exercise package browser contracts

permissions: read-all

on:
  push:
    branches:
      - master
      - canary
    paths:
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/exercise-package-browser-contracts.yml"
      - "shared-module/packages/exercise-protocol/**"
      - "shared-module/packages/exercise-client/**"
      - "shared-module/packages/exercise-react/**"
      - "shared-module/packages/exercise-iframe-host/**"
      - "shared-module/packages/exercise-service-test-utils/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/exercise-package-browser-contracts.yml"
      - "shared-module/packages/exercise-protocol/**"
      - "shared-module/packages/exercise-client/**"
      - "shared-module/packages/exercise-react/**"
      - "shared-module/packages/exercise-iframe-host/**"
      - "shared-module/packages/exercise-service-test-utils/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-contracts:
    name: ${{ matrix.browser }} package contracts
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install package dependencies
        run: |
          set -euo pipefail
          for package in exercise-protocol exercise-client exercise-react exercise-iframe-host exercise-service-test-utils; do
            pnpm --dir "shared-module/packages/$package" install --frozen-lockfile
          done
      - name: Install ${{ matrix.browser }}
        run: pnpm --dir shared-module/packages/exercise-service-test-utils exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} browser contracts
        run: |
          set -euo pipefail
          for package in exercise-protocol exercise-client exercise-react exercise-iframe-host exercise-service-test-utils; do
            pnpm --dir "shared-module/packages/$package" run test:playwright --project=${{ matrix.browser }}
          done
      - name: Upload ${{ matrix.browser }} diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-package-${{ matrix.browser }}-diagnostics
          path: |
            shared-module/packages/exercise-protocol/test-results/
            shared-module/packages/exercise-protocol/playwright-report/
            shared-module/packages/exercise-client/test-results/
            shared-module/packages/exercise-client/playwright-report/
            shared-module/packages/exercise-react/test-results/
            shared-module/packages/exercise-react/playwright-report/
            shared-module/packages/exercise-iframe-host/test-results/
            shared-module/packages/exercise-iframe-host/playwright-report/
            shared-module/packages/exercise-service-test-utils/test-results/
            shared-module/packages/exercise-service-test-utils/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  full-webkit-contracts:
    name: WebKit full package contracts
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install package dependencies
        run: |
          set -euo pipefail
          for package in exercise-protocol exercise-client exercise-react exercise-iframe-host exercise-service-test-utils; do
            pnpm --dir "shared-module/packages/$package" install --frozen-lockfile
          done
      - name: Install WebKit
        run: pnpm --dir shared-module/packages/exercise-service-test-utils exec playwright install --with-deps webkit
      - name: Run WebKit browser contracts
        run: |
          set -euo pipefail
          for package in exercise-protocol exercise-client exercise-react exercise-iframe-host exercise-service-test-utils; do
            pnpm --dir "shared-module/packages/$package" run test:playwright --project=webkit
          done
      - name: Upload WebKit diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-package-webkit-diagnostics
          path: |
            shared-module/packages/exercise-protocol/test-results/
            shared-module/packages/exercise-protocol/playwright-report/
            shared-module/packages/exercise-client/test-results/
            shared-module/packages/exercise-client/playwright-report/
            shared-module/packages/exercise-react/test-results/
            shared-module/packages/exercise-react/playwright-report/
            shared-module/packages/exercise-iframe-host/test-results/
            shared-module/packages/exercise-iframe-host/playwright-report/
            shared-module/packages/exercise-service-test-utils/test-results/
            shared-module/packages/exercise-service-test-utils/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
