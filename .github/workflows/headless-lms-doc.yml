name: headless-lms docs

permissions: read-all

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/setup-nix-env/**"
      - ".github/actions/commit-and-push-generated-content/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/headless-lms-doc.yml"
      - "bin/.common"
      - "bin/generate-doc-files"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "services/headless-lms/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/actions/setup-nix-env/**"
      - ".github/actions/commit-and-push-generated-content/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/headless-lms-doc.yml"
      - "bin/.common"
      - "bin/generate-doc-files"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "services/headless-lms/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The compile-time font guard rejects unhydrated git-lfs pointers.
          lfs: true

      - name: Cache Cargo dependencies and docs build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/headless-lms/target/
          key: ${{ runner.os }}-headless-lms-docs-cargo-${{ hashFiles('services/headless-lms/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-headless-lms-docs-cargo-

      - uses: ./.github/actions/setup-nix-env
        timeout-minutes: 5
      - name: Run pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate doc files
        run: bin/generate-doc-files

      - name: Generate documentation
        run: cargo doc --workspace --no-deps --document-private-items
        working-directory: services/headless-lms

      - name: Check out docs repo
        # zizmor: ignore[artipacked] the persisted ssh-key config is required for the later commit-and-push step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rage/secret-project-331-headless-lms-docs
          path: headless-lms-docs
          fetch-depth: 0
          ssh-key: ${{ secrets.HEADLESS_LMS_DOCS_DEPLOY_KEY }}
        if: ${{ github.ref == 'refs/heads/master' }}

      - name: Copy generated documentation
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../services/headless-lms/target/doc/. .
          touch .nojekyll
        working-directory: ./headless-lms-docs
        if: ${{ github.ref == 'refs/heads/master' }}

      - name: Commit and push docs
        uses: ./.github/actions/commit-and-push-generated-content
        with:
          working-directory: ./headless-lms-docs
        if: ${{ github.ref == 'refs/heads/master' }}
