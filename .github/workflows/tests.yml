name: Tests

permissions: read-all

on:
  push:
    branches:
      - master
      - canary
    paths-ignore:
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  headless_lms_lint:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      # Shared by clippy and the export so the sqlx macro crates compile once.
      SQLX_OFFLINE: 1
    defaults:
      run:
        working-directory: services/headless-lms

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compile-time font guard rejects unhydrated git-lfs pointers.
          lfs: true
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: rust
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/headless-lms
          # Cached build-script binaries hard-code /nix/store paths that a nixpkgs bump removes.
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # OpenAPI drift gate: re-export the specs under server/openapi and fail if they
      # differ from what is committed.
      - name: Export OpenAPI specs
        run: cargo run -p headless-lms-entrypoint -- export-openapi

      - name: Install pnpm dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # The committed specs are oxfmt-formatted; the raw export is not, so format it
      # before diffing.
      - name: Format exported OpenAPI specs
        working-directory: .
        run: pnpm exec oxfmt services/headless-lms/server/openapi/*.json

      - name: Assert committed OpenAPI specs are up to date
        run: git diff --exit-code server/openapi/

  headless_lms:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      # Job-wide so cargo test reuses the build step's artifacts instead of recompiling.
      SQLX_OFFLINE: 1
      DATABASE_URL: postgres://postgres:postgres@localhost/headless_lms_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost/headless_lms_integration
      REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: services/headless-lms

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compile-time font guard rejects unhydrated git-lfs pointers.
          lfs: true
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: rust
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/headless-lms
          # Cached build-script binaries hard-code /nix/store paths that a nixpkgs bump removes.
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The server tests load /icu4x.postcard.2, which only the dev-base image generates.
      - name: Cache ICU4X data
        id: icu4x_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/icu4x
          key: icu4x-${{ hashFiles('services/headless-lms/DockerfileDevelopmentBase.dockerfile') }}

      - name: Copy ICU4X data from the dev-base image
        if: steps.icu4x_cache.outputs.cache-hit != 'true'
        env:
          ICU4X_DIR: ${{ runner.temp }}/icu4x
        run: |
          mkdir -p "$ICU4X_DIR"
          container=$(docker create eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest)
          docker cp "$container:/icu4x.postcard.2" "$ICU4X_DIR/icu4x.postcard.2"
          docker rm "$container"

      - name: Install ICU4X data
        env:
          ICU4X_DIR: ${{ runner.temp }}/icu4x
        run: sudo ln -s "$ICU4X_DIR/icu4x.postcard.2" /icu4x.postcard.2

      - name: Set up test databases
        run: |
          sqlx database setup
          sqlx database setup --database-url "$DATABASE_URL_TEST"

      - name: Build tests
        run: cargo test --no-run

      - name: Run tests
        run: cargo test

  cms:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/cms
      - name: Typecheck
        run: pnpm exec tsc -p ./services/cms --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/cms

  shared-module-common:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for shared-module/packages/common
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/common
        # The common package wraps components from shared-module/packages/components, so
        # type-checking it compiles their sources and needs their dependencies too
      - name: Install dependencies for shared-module/packages/components
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/components
        # Have to run pnpm install on main-frontend because we read next config from there
      - name: Install dependencies for services/main-frontend
        run: pnpm install --frozen-lockfile
        working-directory: ./services/main-frontend
      - name: Typecheck
        run: pnpm exec tsc -p ./shared-module/packages/common --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./shared-module/packages/common

  shared-module-components:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for shared-module/packages/components
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/components
      - name: Typecheck
        run: pnpm exec tsc -p ./shared-module/packages/components --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./shared-module/packages/components

  quizzes:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/quizzes
      - name: Typecheck
        run: pnpm exec tsc -p ./services/quizzes --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/quizzes

  main-frontend:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/main-frontend
      - name: Typecheck
        run: pnpm exec tsc -p ./services/main-frontend --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/main-frontend

  example-exercise-typecheck:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/example-exercise
      - name: Typecheck
        run: pnpm exec tsc -p ./services/example-exercise --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/example-exercise
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./services/example-exercise
      - name: Run Playwright browser tests
        run: pnpm run test:playwright
        working-directory: ./services/example-exercise

  tmc-typecheck:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Runs the remote-grading store tests against Redis too.
      TMC_TEST_REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/tmc
      - name: Typecheck
        run: pnpm exec tsc -p ./services/tmc --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/tmc

  shared-module-exercise-packages:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for the exercise packages
        run: |
          for package in exercise-protocol exercise-client exercise-react exercise-iframe-host exercise-service-test-utils; do
            (cd "shared-module/packages/$package" && pnpm install --frozen-lockfile)
          done
      # Every package below pins the same Playwright version, so one download serves all of them.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./shared-module/packages/exercise-protocol
      - name: Typecheck exercise-protocol
        run: pnpm exec tsc -p ./shared-module/packages/exercise-protocol --noEmit
      - name: Check generated guards are up to date
        run: |
          pnpm run generate-guards
          git diff --exit-code src/core/exercise-service-protocol-types.guard.ts
        working-directory: ./shared-module/packages/exercise-protocol
      # exercise-protocol has no unit suite: its guards have to see real browser-realm structured-clone values.
      - name: Browser tests for exercise-protocol
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-protocol
      - name: Unit tests for exercise-client
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-client
      - name: Browser tests for exercise-client
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-client
      - name: Unit tests for exercise-react
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-react
      - name: Browser tests for exercise-react
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-react
      - name: Typecheck exercise-iframe-host
        run: pnpm exec tsc -p ./shared-module/packages/exercise-iframe-host --noEmit
      - name: Unit tests for exercise-iframe-host
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-iframe-host
      - name: Browser tests for exercise-iframe-host
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-iframe-host
      - name: Unit tests for exercise-service-test-utils
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-service-test-utils
      - name: Browser tests for exercise-service-test-utils
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-service-test-utils

  create-exercise-service:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
        with:
          dev-shell: node
        timeout-minutes: 5
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for shared-module/packages/create-exercise-service
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/create-exercise-service
      - name: Run tests
        run: pnpm run test
        working-directory: ./shared-module/packages/create-exercise-service
      - name: Scaffold a project from the template
        run: pnpm exec tsx scripts/scaffold-to.ts "${{ runner.temp }}/smoke-exercise" smoke-exercise 3002
        working-directory: ./shared-module/packages/create-exercise-service
      - name: Install the generated project
        run: pnpm install
        working-directory: ${{ runner.temp }}/smoke-exercise
      - name: Typecheck the generated project
        run: pnpm exec tsc --noEmit
        working-directory: ${{ runner.temp }}/smoke-exercise
