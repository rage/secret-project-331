name: Tests

permissions: read-all

on:
  push:
    branches:
      - master
      - canary
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  headless_lms:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compile-time font guard rejects unhydrated git-lfs pointers.
          lfs: true
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/headless-lms/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get service container network
        id: get_network
        run: |
          POSTGRES_CONTAINER=$(docker ps -q -f ancestor=pgvector/pgvector:pg18-trixie | head -1)
          if [ -z "$POSTGRES_CONTAINER" ]; then
            echo "Postgres container not found, trying redis..."
            REDIS_CONTAINER=$(docker ps -q -f ancestor=redis:7.2 | head -1)
            if [ -z "$REDIS_CONTAINER" ]; then
              echo "No service containers found"
              exit 1
            fi
            NETWORK=$(docker inspect "$REDIS_CONTAINER" --format='{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}' | head -1)
          else
            NETWORK=$(docker inspect "$POSTGRES_CONTAINER" --format='{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}' | head -1)
          fi
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "Using network: $NETWORK"

      - name: Cargo clippy
        env:
          NETWORK: ${{ steps.get_network.outputs.network }}
        run: |
          docker run --rm \
            --network "$NETWORK" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest \
            cargo clippy --manifest-path services/headless-lms/Cargo.toml -- -D warnings

      - name: Build
        env:
          NETWORK: ${{ steps.get_network.outputs.network }}
        run: |
          docker run --rm \
            --network "$NETWORK" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/services/headless-lms \
            -e CARGO_TERM_COLOR=always \
            eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest \
            cargo build --verbose

      - name: Set up unit test database
        env:
          NETWORK: ${{ steps.get_network.outputs.network }}
        run: |
          docker run --rm \
            --network "$NETWORK" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/services/headless-lms \
            -e DATABASE_URL=postgres://postgres:postgres@postgres/headless_lms_test \
            eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest \
            sqlx database setup

      - name: Set up integration test database
        env:
          NETWORK: ${{ steps.get_network.outputs.network }}
        run: |
          docker run --rm \
            --network "$NETWORK" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/services/headless-lms \
            -e DATABASE_URL=postgres://postgres:postgres@postgres/headless_lms_integration \
            eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest \
            sqlx database setup

      - name: Wait for Redis
        env:
          NETWORK: ${{ steps.get_network.outputs.network }}
        run: |
          docker run --rm \
            --network "$NETWORK" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/services/headless-lms \
            eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest \
            bash -c "timeout 20s bash -c 'until redis-cli -h redis ping; do echo \"Waiting for Redis...\"; sleep 1; done'"

      - name: Run tests
        env:
          NETWORK: ${{ steps.get_network.outputs.network }}
        run: |
          docker run --rm \
            --network "$NETWORK" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/services/headless-lms \
            -e CARGO_TERM_COLOR=always \
            -e DATABASE_URL=postgres://postgres:postgres@postgres/headless_lms_test \
            -e DATABASE_URL_TEST=postgres://postgres:postgres@postgres/headless_lms_integration \
            -e REDIS_URL=redis://redis:6379/1 \
            eu.gcr.io/moocfi-public/project-331-headless-lms-dev-base:latest \
            cargo test --verbose

  cms:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/cms
      - name: Typecheck
        run: pnpm exec tsc -p ./services/cms --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/cms

  shared-module-common:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for shared-module/packages/common
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/common
        # Have to run pnpm install on main-frontend because we read next config from there
      - name: Install dependencies for services/main-frontend
        run: pnpm install --frozen-lockfile
        working-directory: ./services/main-frontend
      - name: Typecheck
        run: pnpm exec tsc -p ./shared-module/packages/common --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./shared-module/packages/common

  shared-module-components:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for shared-module/packages/components
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/components
      - name: Typecheck
        run: pnpm exec tsc -p ./shared-module/packages/components --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./shared-module/packages/components

  quizzes:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/quizzes
      - name: Typecheck
        run: pnpm exec tsc -p ./services/quizzes --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/quizzes

  main-frontend:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/main-frontend
      - name: Typecheck
        run: pnpm exec tsc -p ./services/main-frontend --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/main-frontend

  example-exercise-typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/example-exercise
      - name: Typecheck
        run: pnpm exec tsc -p ./services/example-exercise --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/example-exercise
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./services/example-exercise
      - name: Run Playwright browser tests
        run: pnpm run test:playwright
        working-directory: ./services/example-exercise

  tmc-typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: pnpm install --frozen-lockfile for the root of the repo
        run: pnpm install --frozen-lockfile
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ./services/tmc
      - name: Typecheck
        run: pnpm exec tsc -p ./services/tmc --noEmit
      - name: Run tests
        run: pnpm run test
        working-directory: ./services/tmc

  shared-module-exercise-packages:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for the exercise packages
        run: |
          for package in exercise-protocol exercise-client exercise-react exercise-iframe-host exercise-service-test-utils; do
            (cd "shared-module/packages/$package" && pnpm install --frozen-lockfile)
          done
      # Every package below pins the same Playwright version, so one download serves all of them.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./shared-module/packages/exercise-protocol
      - name: Typecheck exercise-protocol
        run: pnpm exec tsc -p ./shared-module/packages/exercise-protocol --noEmit
      - name: Check generated guards are up to date
        run: |
          pnpm run generate-guards
          git diff --exit-code src/core/exercise-service-protocol-types.guard.ts
        working-directory: ./shared-module/packages/exercise-protocol
      # exercise-protocol has no unit suite: its guards have to see real browser-realm structured-clone values.
      - name: Browser tests for exercise-protocol
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-protocol
      - name: Unit tests for exercise-client
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-client
      - name: Browser tests for exercise-client
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-client
      - name: Unit tests for exercise-react
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-react
      - name: Browser tests for exercise-react
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-react
      - name: Typecheck exercise-iframe-host
        run: pnpm exec tsc -p ./shared-module/packages/exercise-iframe-host --noEmit
      - name: Unit tests for exercise-iframe-host
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-iframe-host
      - name: Browser tests for exercise-iframe-host
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-iframe-host
      - name: Unit tests for exercise-service-test-utils
        run: pnpm run test
        working-directory: ./shared-module/packages/exercise-service-test-utils
      - name: Browser tests for exercise-service-test-utils
        run: pnpm run test:playwright
        working-directory: ./shared-module/packages/exercise-service-test-utils

  create-exercise-service:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-env
      - name: Install dependencies at repository root
        run: pnpm install --frozen-lockfile
      - name: Install dependencies for shared-module/packages/create-exercise-service
        run: pnpm install --frozen-lockfile
        working-directory: ./shared-module/packages/create-exercise-service
      - name: Run tests
        run: pnpm run test
        working-directory: ./shared-module/packages/create-exercise-service
      - name: Scaffold a project from the template
        run: pnpm exec tsx scripts/scaffold-to.ts "${{ runner.temp }}/smoke-exercise" smoke-exercise 3002
        working-directory: ./shared-module/packages/create-exercise-service
      - name: Install the generated project
        run: pnpm install
        working-directory: ${{ runner.temp }}/smoke-exercise
      - name: Typecheck the generated project
        run: pnpm exec tsc --noEmit
        working-directory: ${{ runner.temp }}/smoke-exercise
