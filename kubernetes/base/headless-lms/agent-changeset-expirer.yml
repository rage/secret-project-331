apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-changeset-expirer
  labels:
    app: agent-changeset-expirer
    deploymentType: with-init-container-cronjob
    needs-db: "job"
spec:
  schedule: "43 3 * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: agent-changeset-expirer
              image: headless-lms
              command: ["bin/run", "agent-changeset-expirer"]
              resources:
                requests:
                  memory: 200Mi
                  cpu: 20m
                limits:
                  memory: 500Mi
                  cpu: 200m
              envFrom:
                - secretRef:
                    name: headless-lms-secrets
          initContainers:
            - name: headless-lms-wait-for-db
              image: headless-lms
              command:
                - bash
                - "-c"
                - |
                  echo Waiting for postgres to be available
                  timeout 120 ./wait-for-db.sh
                  ./wait-for-db-migrations.sh
              resources:
                requests:
                  memory: 200Mi
                  cpu: 20m
                limits:
                  memory: 500Mi
                  cpu: 200m
              envFrom:
                - secretRef:
                    name: headless-lms-secrets
