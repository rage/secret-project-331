apiVersion: batch/v1
kind: CronJob
metadata:
  name: course-designer-weekly-digest
  labels:
    app: course-designer-weekly-digest
    deploymentType: with-init-container-cronjob
    needs-db: "job"
spec:
  schedule: "13 6 * * 1"
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: course-designer-weekly-digest
              image: headless-lms
              command: ["bin/run", "course-designer-weekly-digest"]
              resources:
                requests:
                  memory: 200Mi
                  cpu: 20m
                limits:
                  memory: 500Mi
                  cpu: 200m
              envFrom:
                - secretRef:
                    name: headless-lms-secrets
          initContainers:
            - name: headless-lms-wait-for-db
              image: headless-lms
              command:
                - bash
                - "-c"
                - |
                  echo Waiting for postgres to be available
                  timeout 120 ./wait-for-db.sh
                  ./wait-for-db-migrations.sh
              resources:
                requests:
                  memory: 200Mi
                  cpu: 20m
                limits:
                  memory: 500Mi
                  cpu: 200m
              envFrom:
                - secretRef:
                    name: headless-lms-secrets
