apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-registrar
  labels:
    app: credit-registrar
    deploymentType: with-init-container
    needs-db: "true"
spec:
  # The circuit breaker is per pod, so a second replica would double the calls to a failing registry.
  replicas: 1
  # Also one pod during a rollout: the new one starts only once the old one has finished its calls.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: credit-registrar
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: credit-registrar
    spec:
      # An import call may run for 60 minutes and is left to finish on shutdown; killing it midway
      # leaves the whole batch uncertain.
      terminationGracePeriodSeconds: 3900
      containers:
        - name: credit-registrar
          image: headless-lms
          command: ["bin/run", "credit-registrar"]
          resources:
            requests:
              memory: 200Mi
              cpu: 20m
            limits:
              memory: 500Mi
              cpu: 200m
          envFrom:
            - secretRef:
                name: headless-lms-secrets
      initContainers:
        - name: headless-lms-wait-for-db
          image: headless-lms
          command:
            - bash
            - "-c"
            - |
              echo Waiting for postgres to be available
              timeout 120 ./wait-for-db.sh
              ./wait-for-db-migrations.sh
          resources:
            requests:
              memory: 200Mi
              cpu: 20m
            limits:
              memory: 500Mi
              cpu: 200m
          envFrom:
            - secretRef:
                name: headless-lms-secrets
