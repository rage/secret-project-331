apiVersion: apps/v1
kind: Deployment
metadata:
  name: suotar-syncer
  labels:
    app: suotar-syncer
    deploymentType: with-init-container
    needs-db: "true"
spec:
  # A second replica would race for the same linking-mail slots and double-count the per-module
  # counters.
  replicas: 1
  # Also one pod during a rollout: the new one starts only once the old one has finished its calls.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: suotar-syncer
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: suotar-syncer
    spec:
      # Lets an enrolment listing or course-code check already running finish on shutdown.
      terminationGracePeriodSeconds: 1800
      containers:
        - name: suotar-syncer
          image: headless-lms
          command: ["bin/run", "suotar-syncer"]
          resources:
            requests:
              memory: 200Mi
              cpu: 20m
            limits:
              memory: 500Mi
              cpu: 200m
          envFrom:
            - secretRef:
                name: headless-lms-secrets
      initContainers:
        - name: headless-lms-wait-for-db
          image: headless-lms
          command:
            - bash
            - "-c"
            - |
              echo Waiting for postgres to be available
              timeout 120 ./wait-for-db.sh
              ./wait-for-db-migrations.sh
          resources:
            requests:
              memory: 200Mi
              cpu: 20m
            limits:
              memory: 500Mi
              cpu: 200m
          envFrom:
            - secretRef:
                name: headless-lms-secrets
