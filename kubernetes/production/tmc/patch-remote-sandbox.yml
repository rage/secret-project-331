# Grading runs on the shared sandbox servers, so the service needs no rights to create pods.
# The tmc-remote-sandbox Secret holds the TMC_REMOTE_SANDBOX_* settings, including the Redis URL
# for pending gradings (services/tmc/README.md).
- op: remove
  path: /spec/template/spec/serviceAccountName
- op: add
  path: /spec/template/spec/automountServiceAccountToken
  value: false
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: TMC_GRADING_SANDBOX
    value: remote
- op: add
  path: /spec/template/spec/containers/0/envFrom
  value:
    - secretRef:
        name: tmc-remote-sandbox
