engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

nodeVersion: 24.21.0

packageExtensions:
  # These import packages their manifests don't declare, which fails without hoisting.
  "@vectopus/atlas-icons-react":
    dependencies:
      "@babel/runtime": "^7.18.3"
    peerDependencies:
      react: ">=16"
  vega-embed:
    dependencies:
      tslib: "^2.0.0"
      vega-util: "^1.17.0"

overrides:
  # Upper bound is load-bearing: @emotion/react wants ^7.18.3 and deep-imports
  # @babel/runtime/helpers/esm/extends, which v8 no longer exposes. An unbounded
  # ">=7.26.10" lets the resolver pick v8 and the Turbopack build then fails.
  "@babel/runtime@<7.26.10": ">=7.26.10 <8"
  diff@>=4.0.0 <4.0.4: ">=4.0.4"
  dompurify@<3.3.2: ">=3.3.2"
  dompurify@<=3.3.1: ">=3.3.2"
  dompurify@<=3.3.3: ">=3.4.0"
  dompurify@>=3.1.3 <=3.3.1: ">=3.3.2"
  follow-redirects@<=1.15.11: ">=1.16.0"
  glob@>=10.2.0 <10.5.0: ">=10.5.0"
  js-yaml@>=4.0.0 <4.1.1: ">=4.1.1"
  minimatch@<3.1.3: ">=3.1.3"
  minimatch@<3.1.4: ">=3.1.4"
  minimatch@>=9.0.0 <9.0.6: ">=9.0.6"
  minimatch@>=9.0.0 <9.0.7: ">=9.0.7"
  path-to-regexp@>=8.0.0 <8.4.0: ">=8.4.0"
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  serialize-javascript@<=7.0.2: ">=7.0.3"
  webpack-dev-server@<=5.2.0: ">=5.2.1"
  yaml@>=1.0.0 <1.10.3: ">=1.10.3"

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

permissions:
  "@parcel/watcher":
    build: true
  core-js:
    build: false
  core-js-pure:
    build: false
  esbuild:
    build: true
  node:
    build: false
  sharp:
    build: false
  unrs-resolver:
    build: true

trustLockfile: true

updateNotifier: false

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"
  - postcss@8.5.23
  - body-parser@2.3.0
  - nanoid@3.3.18

# Docker installs use the global virtual store, which has no hoisted fallback; match it everywhere
# so undeclared dependencies fail locally instead of only in image builds.
hoistPattern: []

autoDedupe: true

lockfile:
  includeResolutionSettings: true
