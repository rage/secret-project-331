engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

nodeVersion: 26.13.0

packageExtensions:
  # These import packages their manifests don't declare, which fails without hoisting.
  "@vectopus/atlas-icons-react":
    dependencies:
      "@babel/runtime": "^7.18.3"
    peerDependencies:
      react: ">=16"
  vega-embed:
    dependencies:
      tslib: "^2.0.0"
      vega-util: "^1.17.0"

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

permissions:
  "@parcel/watcher":
    build: true
  core-js:
    build: false
  core-js-pure:
    build: false
  esbuild:
    build: true
  node:
    build: false
  sharp:
    build: false
  unrs-resolver:
    build: true

trustLockfile: true

updateNotifier: false

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"
  - postcss@8.5.23
  - markdown-it@14.3.3

# Docker installs use the global virtual store, which has no hoisted fallback; match it everywhere
# so undeclared dependencies fail locally instead of only in image builds.
hoistPattern: []

autoDedupe: true

lockfile:
  includeResolutionSettings: true

allowBuilds:
  "@parcel/watcher": false
overrides:
  # Upper bound is load-bearing: @emotion/react wants ^7.18.3 and deep-imports
  # @babel/runtime/helpers/esm/extends, which v8 no longer exposes. An unbounded
  # ">=7.26.10" lets the resolver pick v8 and the Turbopack build then fails.
  "@babel/runtime@<7.26.10": ">=7.26.10 <8"
  dompurify@<=3.4.16: ^3.4.17
  glob@>=13.0.0 <=14.0.1: ^14.0.2
  js-yaml@>=5.0.0 <=5.4.0: ^5.4.1
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
  serialize-javascript@<7.1.3: ^7.1.3
  smol-toml@<=1.8.0: ^1.9.0
