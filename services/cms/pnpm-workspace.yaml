engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

nodeVersion: 24.18.0

overrides:
  # Upper bound is load-bearing: @emotion/react wants ^7.18.3 and deep-imports
  # @babel/runtime/helpers/esm/extends, which v8 no longer exposes. An unbounded
  # ">=7.26.10" lets the resolver pick v8 and the Turbopack build then fails.
  "@babel/runtime@<7.26.10": ">=7.26.10 <8"
  diff@>=4.0.0 <4.0.4: ">=4.0.4"
  dompurify@<3.3.2: ">=3.3.2"
  dompurify@<=3.3.1: ">=3.3.2"
  dompurify@<=3.3.3: ">=3.4.0"
  dompurify@>=3.1.3 <=3.3.1: ">=3.3.2"
  follow-redirects@<=1.15.11: ">=1.16.0"
  glob@>=10.2.0 <10.5.0: ">=10.5.0"
  js-yaml@>=4.0.0 <4.1.1: ">=4.1.1"
  minimatch@<3.1.3: ">=3.1.3"
  minimatch@<3.1.4: ">=3.1.4"
  minimatch@>=9.0.0 <9.0.6: ">=9.0.6"
  minimatch@>=9.0.0 <9.0.7: ">=9.0.7"
  path-to-regexp@>=8.0.0 <8.4.0: ">=8.4.0"
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  serialize-javascript@<=7.0.2: ">=7.0.3"
  webpack-dev-server@<=5.2.0: ">=5.2.1"
  yaml@>=1.0.0 <1.10.3: ">=1.10.3"

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  core-js-pure: false
  esbuild: true
  node: false
  sharp: false
  unrs-resolver: true

trustLockfile: true

confirmModulesPurge: false

updateNotifier: false

verifyDepsBeforeRun: install

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - showdown@2.1.1
  - "@babel/plugin-transform-modules-systemjs@7.29.4"
  - uuid@11.1.1
  - qs@6.15.2
  - "@babel/core@7.29.1"
  - markdown-it@14.1.2
  - "@opentelemetry/core@2.8.0"
  - undici@7.28.0
  - linkify-it@5.0.1 || 5.0.2
  - js-yaml@3.15.0 || 3.15.1 || 4.1.2 || 5.1.1 || 5.2.1 || 5.2.2
  - adm-zip@0.6.0
  - brace-expansion@5.0.7 || 5.0.8 || 5.0.9
  - body-parser@2.3.0
  - svgo@3.3.4
  - dompurify@3.4.9 || 3.4.11 || 3.4.12 || 3.4.13
  - sharp@0.35.0
  - fast-uri@3.1.5
  - image-size@2.0.3
  - nanoid@3.3.17 || 3.3.18
  - extract-zip@2.0.2
