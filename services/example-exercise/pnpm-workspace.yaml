engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

nodeVersion: 26.13.0

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

permissions:
  esbuild:
    build: true
  node:
    build: false
  sharp:
    build: false

trustLockfile: true

updateNotifier: false

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"

# Docker installs use the global virtual store, which has no hoisted fallback; match it everywhere
# so undeclared dependencies fail locally instead of only in image builds.
hoistPattern: []

autoDedupe: true

lockfile:
  includeResolutionSettings: true
