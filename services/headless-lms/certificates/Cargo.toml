[package]
name = "headless-lms-certificates"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
headless-lms-base = { path = "../base" }
headless-lms-utils = { path = "../utils" }
headless-lms-models = { path = "../models" }
rust-i18n = "4.2.1"

# An SVG rendering library.
resvg = "0.48.1"
# An SVG simplification library.
usvg = "0.48.1"
# A simple, streaming XML writer.
xmlwriter = "0.1.0"
# High performance xml reader and writer
quick-xml = "0.41.0"
# International Components for Unicode
icu = { version = "2.3.0", features = ["serde"] }
# Trait and struct definitions for the ICU data provider
icu_provider = "2.3.0"
# Locale fallback adapters for ICU data providers
icu_provider_adapters = "2.3.0"
# Single assignment cells and lazy values.
once_cell = "1.21.4"
# URL library for Rust, based on the WHATWG URL Standard
url = "2.5.8"
# Application-level tracing for Rust.
tracing = "0.1.44"
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# Date and time library for Rust
chrono = "0.4.45"
# A library to generate and parse UUIDs.
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }
# An implementation of futures and streams featuring zero allocations, composability, and itera…
futures = "0.3.34"
# supports loading ICU4X data from a single serialized blob
icu_provider_blob = "2.3.0"
# 🧰 The Rust SQL Toolkit. An async, pure Rust SQL crate featuring compile-time checked queries
sqlx.workspace = true
# Font parsing — used to check which font covers a given string when resolving fonts per text.
ttf-parser = "0.25.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "allow"
