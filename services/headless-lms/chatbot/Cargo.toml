[package]
name = "headless-lms-chatbot"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
headless-lms-base = { path = "../base" }
headless-lms-utils = { path = "../utils" }
headless-lms-models = { path = "../models" }
# Evaluates the permission a client tool requires, both when offering it and when applying an answer.
headless-lms-authorization = { path = "../authorization" }

# Wrapper types (SecretString/SecretBox) for sensitive values such as API keys.
secrecy.workspace = true

# Date and time library for Rust
chrono = { version = "0.4.45", features = ["serde"] }
# An implementation of futures and streams featuring zero allocations, composability, and itera…
futures = "0.3.34"
# Common utilities and extension traits for the futures-rs library.
futures-util = "0.3.34"
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio.workspace = true
# Utilities for working with Tokio.
tokio-util = "0.7.19"
# Utilities to work with `Stream` and `tokio`.
tokio-stream.workspace = true
# higher level HTTP client library
reqwest = { version = "0.13.4", features = ["brotli", "gzip", "json", "http2", "rustls", "stream"] }
# A generic serialization/deserialization framework
serde = { version = "1.0.229", features = ["derive"] }
# A JSON serialization file format
serde_json = "1.0.151"
# Hash map that keeps insertion order, so serialized tool and response schemas are byte-stable and
# Azure's prompt cache can match on them.
indexmap = { version = "2.14.0", features = ["serde"] }
# Application-level tracing for Rust.
tracing = "0.1.44"
# A library to generate and parse UUIDs.
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }
# Flexible concrete Error type built on std::error::Error
anyhow = "1.0.104"
# 🧰 The Rust SQL Toolkit. An async, pure Rust SQL crate featuring compile-time checked queries
sqlx.workspace = true
# Asynchronous streams using async & await notation
async-stream = "0.3.6"
# Types and traits for working with bytes
bytes = "1.12.1"
# Azure Storage crate from the Azure SDK for Rust
azure_storage = "0.21.0"
# Azure Blob Storage crate from the Azure SDK for Rust
azure_storage_blobs = "0.21.0"
# Rust wrappers around Microsoft Azure REST APIs - Core crate
azure_core = "0.21.0"
# URL library for Rust, based on the WHATWG URL Standard
url = "2.5.8"
# A crate for safe and ergonomic pin-projection.
pin-project = "1.1.13"
# Utilities for enriching errors with `tracing`.
tracing-error = "0.2.1"
#  A library to acquire a stack trace (backtrace) at runtime in a Rust program. Should be removed after Rust 1.65.
backtrace = "0.3.76"
# Utilities for random number generation
rand = "0.10.2"
# Code-first OpenAPI schema generation for shared utility structs used in request/response models.
utoipa.workspace = true

[dev-dependencies]
# `#[tokio::test]`, for the tool permission tests, which need a database connection.
tokio = { workspace = true, features = ["macros"] }
# Reads DATABASE_URL out of .env for those tests, the way the models crate's tests do.
dotenvy = "0.15"

[lints.clippy]
unwrap_used = "deny"
expect_used = "allow"
