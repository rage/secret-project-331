[package]
name = "headless-lms-email-delivery-workers"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
headless-lms-external-service-clients = { path = "../../../infrastructure/external-service-clients" }
