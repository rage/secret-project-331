[package]
name = "headless-lms-integration-sync-workers"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
headless-lms-base = { path = "../../../foundation/base" }
headless-lms-utils = { path = "../../../foundation/utils" }
headless-lms-models = { path = "../../../database/models" }
headless-lms-use-cases = { path = "../../use-cases" }
headless-lms-external-service-clients = { path = "../../../infrastructure/external-service-clients" }
headless-lms-chatbot = { path = "../../../features/chatbot" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = [ "serde" ] }
dotenvy = "0.15"
flate2 = "1.1.10"
futures = "0.3.34"
reqwest = { version = "0.13.4", features = [ "brotli", "gzip", "json", "http2", "rustls", "stream" ] }
secrecy = { workspace = true }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [ "derive", "postgres" ] }
tar = "0.4.46"
tokio = { workspace = true, features = [ "macros", "time" ] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.0", features = [ "serde" ] }
