engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

nodeVersion: 24.21.0

overrides:
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  yaml@>=1.0.0 <1.10.3: ">=1.10.3"

packageExtensions:
  # These import packages their manifests don't declare, which fails without hoisting.
  "@vectopus/atlas-icons-react":
    dependencies:
      "@babel/runtime": "^7.18.3"
    peerDependencies:
      react: ">=16"

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

permissions:
  node:
    build: false
  sharp:
    build: false
  unrs-resolver:
    build: true

trustLockfile: true

updateNotifier: false

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"
  - postcss@8.5.23
  - js-yaml@3.15.1
  - brace-expansion@1.1.18 || 2.1.4
  - nanoid@3.3.18

# Docker installs use the global virtual store, which has no hoisted fallback; match it everywhere
# so undeclared dependencies fail locally instead of only in image builds.
hoistPattern: []

autoDedupe: true

lockfile:
  includeResolutionSettings: true

allowBuilds:
  '@parcel/watcher': false
