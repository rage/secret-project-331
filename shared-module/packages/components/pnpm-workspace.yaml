engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

nodeVersion: 24.18.0

overrides:
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  yaml@>=1.0.0 <1.10.3: ">=1.10.3"

packageExtensions:
  # atlas-icons-react's index.js requires @babel/runtime/helpers/extends, but its manifest
  # declares no dependencies at all. Resolution only ever worked when something else happened
  # to hoist @babel/runtime into .pnpm/node_modules; declaring it here stops that being luck.
  "@vectopus/atlas-icons-react":
    dependencies:
      "@babel/runtime": "^7.18.3"

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

allowBuilds:
  node: false
  sharp: false
  unrs-resolver: true

trustLockfile: true

confirmModulesPurge: false

updateNotifier: false

verifyDepsBeforeRun: install

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - "@babel/core@7.29.1"
  - js-yaml@3.15.0 || 3.15.1
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.2 || 2.1.3 || 2.1.4
  - sharp@0.35.0
  - nanoid@3.3.18
