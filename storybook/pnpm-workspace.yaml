engineStrict: true

linkWorkspacePackages: true

pmOnFail: download

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

nodeVersion: 24.21.0

packageExtensions:
  # These import packages their manifests don't declare, which fails without hoisting.
  "@vectopus/atlas-icons-react":
    dependencies:
      "@babel/runtime": "^7.18.3"
    peerDependencies:
      react: ">=16"

overrides:
  lodash@<=4.17.23: ">=4.18.0"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  lodash@>=4.0.0 <=4.17.23: ">=4.18.0"
  rollup@>=4.0.0 <4.59.0: ">=4.59.0"
  yaml@>=1.0.0 <1.10.3: ">=1.10.3"

preferFrozenLockfile: true

preferWorkspacePackages: true

registrySupportsTimeField: false

resolutionMode: time-based

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: false

strictDepBuilds: true

permissions:
  esbuild:
    build: true
  node:
    build: false

trustLockfile: true

updateNotifier: false

minimumReleaseAgeExclude:
  - brace-expansion@5.0.9

# Docker installs use the global virtual store, which has no hoisted fallback; match it everywhere
# so undeclared dependencies fail locally instead of only in image builds.
hoistPattern: []

autoDedupe: true

lockfile:
  includeResolutionSettings: true
