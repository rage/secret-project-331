# Use the pnpm version from the root packageManager field.
pmOnFail: download

# Check that packages are compatible with the runtime in package.json devEngines.runtime
nodeVersion: 24.21.0
# Dont install packages that are not combatibile with the 'nodeVersion'
engineStrict: true
# Use pnpm-lock.yaml if we can
preferFrozenLockfile: true

# Don't tell about pnpm updates
updateNotifier: false
# Make each package to have its own lockfile
sharedWorkspaceLockfile: false

# Delay brand-new releases by one week to reduce supply-chain risk (minutes)
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

# Fail install if a dependency wants to run unreviewed build scripts (it's better to fail so that we know to review the build scripts straight away)
strictDepBuilds: true

permissions:
  "@playwright/browser-chromium":
    build: true
  node:
    build: false

# Trust committed lockfiles instead of revalidating release-age policy on every install
trustLockfile: true

# Prefer local workspace packages and link them for better DX
linkWorkspacePackages: true
# Use local versions over registry when available
preferWorkspacePackages: true
# Keep workspace:* behavior when adding deps from the workspace
saveWorkspaceProtocol: rolling

# Make repeat installs faster and reduce surprise subdep bumps
resolutionMode: time-based
# Set to true only if your registry supports "time" in abbreviated metadata
registrySupportsTimeField: false

minimumReleaseAgeExclude:
  - "typescript@7.0.2"
  - "@typescript/typescript-*"
  - "@typescript/typescript6@6.0.2"

# Docker installs use the global virtual store, which has no hoisted fallback; match it everywhere
# so undeclared dependencies fail locally instead of only in image builds.
hoistPattern: []

autoDedupe: true

lockfile:
  includeResolutionSettings: true
